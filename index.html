<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPMPazari - Car Parking Multiplayer Araç İlanları</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            dark: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        *, *::before, *::after { transition-property: color, background-color, border-color, box-shadow, opacity, transform, filter; transition-duration: 220ms; transition-timing-function: cubic-bezier(.22,.61,.36,1); }
        button, input, select, textarea { transition-duration: 180ms; }
        .soft-enter { animation: softEnter .42s cubic-bezier(.22,.61,.36,1) both; }
        @keyframes softEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #photoPreview img { aspect-ratio: 16 / 10; object-fit: cover; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 dark:bg-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-brand-500 selection:text-white transition-colors duration-300" id="pageBody">

    <!-- LOADING EKRANI (Sadece Giriş Sonrası İçin) -->
    <div id="loadingScreen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-500 hidden">
        <div class="relative flex items-center justify-center">
            <div class="w-20 h-20 border-4 border-brand-500/20 border-t-brand-500 rounded-full animate-spin"></div>
            <i class="fa-solid fa-car text-brand-500 text-2xl absolute"></i>
        </div>
        <p class="mt-4 text-slate-300 font-medium tracking-wide animate-pulse" id="loadingText">Giriş Yapılıyor, Yükleniyor...</p>
    </div>

    <!-- NAVBAR -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="changeView('home')">
                <div class="bg-brand-500 text-slate-950 p-2.5 rounded-xl font-black text-xl flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-car-side"></i>
                </div>
                <div>
                    <span class="text-2xl font-black tracking-tight text-white dark:text-white">CPM<span class="text-brand-500">Pazari</span></span>
                    <span class="block text-[10px] text-slate-400 tracking-widest uppercase font-semibold" data-i18n="navSubTitle">Car Parking Multiplayer Pazar</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Dil Seçici (20 Dil) -->
                <select id="languageSelect" onchange="changeLanguage(this.value)" class="bg-slate-800 border border-slate-700 text-white text-xs rounded-xl px-2.5 py-2 focus:outline-none focus:border-brand-500">
                    <option value="tr">🇹🇷 Türkçe</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="de">🇩🇪 Deutsch</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="ru">🇷🇺 Русский</option>
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="az">🇦🇿 Azərbaycan</option>
                    <option value="fa">🇮🇷 فارسی</option>
                    <option value="id">🇮🇩 Indonesia</option>
                    <option value="pt">🇵🇹 Português</option>
                    <option value="it">🇮🇹 Italiano</option>
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="ko">🇰🇷 한국어</option>
                    <option value="zh">🇨🇳 中文</option>
                    <option value="pl">🇵🇱 Polski</option>
                    <option value="nl">🇳🇱 Nederlands</option>
                    <option value="uk">🇺🇦 Українська</option>
                    <option value="hi">🇮🇳 हिन्दी</option>
                    <option value="vi">🇻🇳 Tiếng Việt</option>
                </select>

                <!-- Tema Değiştirici -->
                <button onclick="toggleTheme()" id="themeToggleBtn" class="bg-slate-800 hover:bg-slate-700 text-amber-400 p-2.5 rounded-xl border border-slate-700 transition" title="Tema Değiştir">
                    <i class="fa-solid fa-sun text-sm"></i>
                </button>

                <div class="flex items-center space-x-4" id="navAuthArea">
                    <!-- Dinamik olarak dolacak -->
                </div>
            </div>
        </div>
    </header>

    <!-- ANA İÇERİK CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8" id="mainContainer">
        <!-- İçerikler JavaScript ile buraya yüklenecek -->
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-950 border-t border-slate-800 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-500 text-sm">
            <p data-i18n="footerCopy">&copy; 2026 CPMPazari. Car Parking Multiplayer Alım Satım Platformu.</p>
        </div>
    </footer>

    <!-- MODALLER -->
    <!-- Giriş / Kayıt Modal -->
    <div id="authModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            
            <div class="flex border-b border-slate-800 mb-6">
                <button onclick="switchTab('login')" id="loginTabBtn" class="flex-1 pb-3 font-bold text-brand-500 border-b-2 border-brand-500 transition" data-i18n="loginTab">Giriş Yap</button>
                <button onclick="switchTab('register')" id="registerTabBtn" class="flex-1 pb-3 font-bold text-slate-400 hover:text-white transition" data-i18n="registerTab">Kayıt Ol</button>
            </div>

            <!-- Giriş Formu -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1" data-i18n="usernameOrEmail">Kullanıcı Adı veya E-posta</label>
                    <input type="text" id="loginUser" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1" data-i18n="password">Şifre</label>
                    <input type="password" id="loginPass" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500">
                </div>
                <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-brand-500/20" data-i18n="loginBtn">Giriş Yap</button>
            </form>

            <!-- Kayıt Formu -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1" data-i18n="username">Kullanıcı Adı</label>
                    <input type="text" id="regUser" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1" data-i18n="email">E-posta Adresi</label>
                    <input type="email" id="regEmail" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1" data-i18n="password">Şifre</label>
                    <input type="password" id="regPass" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1" data-i18n="passwordConfirm">Şifre Tekrarı</label>
                    <input type="password" id="regPassConfirm" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500">
                </div>
                <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-brand-500/20" data-i18n="registerBtn">Kayıt Ol</button>
            </form>
        </div>
    </div>

    <!-- İlan Ekleme Modal -->
    <div id="addCarModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl p-6 shadow-2xl relative my-8">
            <button onclick="closeAddCarModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-car text-brand-500"></i> <span data-i18n="addCarModalTitle">Car Parking Araç İlanı Ver</span></h2>
            
            <form id="addCarForm" onsubmit="handleAddNewCar(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">İlan Başlığı</label>
                    <input type="text" id="carTitle" required placeholder="Örn: Full Crown Şahin / Temiz Araç" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Motor Gücü (HP)</label>
                        <input type="number" id="carHp" min="0" required placeholder="1695" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Modifiye / Tuning Durumu</label>
                        <select id="carCondition" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white">
                            <option value="Full Crown + W16">Full Crown + W16 (Full+Full)</option>
                            <option value="Drift Spec (Ayarlı)">Drift Spec (Ayarlı)</option>
                            <option value="Drag Spec (1695 HP)">Drag Spec (1695 HP)</option>
                            <option value="Stock (Orijinal)">Stock (Orijinal)</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Fiyat</label>
                        <input type="number" id="carPrice" min="0" required placeholder="50000000" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Ödeme Birimi</label>
                        <select id="carCurrency" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white">
                            <option value="coin">🪙 Coin</option>
                            <option value="tl">₺ TL</option>
                            <option value="gold">🥇 Altın</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Araç Görselleri</label>
                    <input type="file" id="carPhotoFiles" accept="image/*" multiple class="hidden" onchange="handlePhotoSelection(event)">
                    <button type="button" onclick="document.getElementById('carPhotoFiles').click()" class="w-full border border-dashed border-brand-500/40 bg-brand-500/5 hover:bg-brand-500/10 text-brand-400 font-bold py-4 rounded-xl transition flex flex-col items-center justify-center gap-2">
                        <i class="fa-solid fa-images text-xl"></i>
                        <span>Galeriden Görsel Seç</span>
                        <span class="text-[10px] text-slate-500 font-normal">Birden fazla fotoğraf seçebilirsin</span>
                    </button>
                    <div id="photoPreview" class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3"></div>
                    <p id="photoCountText" class="text-[10px] text-slate-500 mt-1">Henüz görsel seçilmedi.</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Açıklama & Vinyl / Setup Bilgisi</label>
                    <textarea id="carDesc" rows="3" required placeholder="Araç hakkında detayları yaz..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white"></textarea>
                </div>
                <div class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-xl text-amber-400 text-xs flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation text-base"></i>
                    <span>İlanınız gönderildikten sonra yönetici onayından geçtikten sonra yayına alınacaktır.</span>
                </div>
                <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-brand-500/20">İlanı Onaya Gönder</button>
            </form>
        </div>
    </div>

        const DEFAULT_CARS = [];
        const DEFAULT_USERS = [];

        let currentUser = JSON.parse(localStorage.getItem('cpm_current_user')) || null;
        let cars = JSON.parse(localStorage.getItem('cpm_cars')) || DEFAULT_CARS;
        let users = JSON.parse(localStorage.getItem('cpm_users')) || DEFAULT_USERS;
        let currentView = 'home';
        let selectedCarId = null;
        let currentLang = localStorage.getItem('cpm_lang') || 'tr';
        let currentTheme = localStorage.getItem('cpm_theme') || 'dark';

        const demoTitles = new Set([
            '1695 HP Full Crown V8 Tofaş Şahin / Özel Basık',
            'Drift Spec M3 E30 / 925 HP Ayarlı Süspansiyon'
        ]);
        if(cars.some(c => demoTitles.has(c.title))) {
            cars = cars.filter(c => !demoTitles.has(c.title));
        }
        cars = cars.map(c => ({
            ...c,
            currency: c.currency || 'coin',
            likes: Number.isFinite(c.likes) ? c.likes : 0,
            dislikes: Number.isFinite(c.dislikes) ? c.dislikes : 0,
            views: Number.isFinite(c.views) ? c.views : 0,
            likedBy: Array.isArray(c.likedBy) ? c.likedBy : [],
            dislikedBy: Array.isArray(c.dislikedBy) ? c.dislikedBy : []
        }));


        window.onload = function() {
            document.getElementById('languageSelect').value = currentLang;
            applyTheme(currentTheme);
            updateTranslations();
            updateNavbar();
            renderView();
        };

        // Tema Yönetimi (Koyu / Açık)
        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('cpm_theme', currentTheme);
            applyTheme(currentTheme);
        }

        function applyTheme(theme) {
            const body = document.getElementById('pageBody');
            const themeBtn = document.getElementById('themeToggleBtn');
            if(theme === 'light') {
                body.classList.remove('bg-slate-900', 'text-slate-100');
                body.classList.add('bg-slate-100', 'text-slate-900');
                themeBtn.innerHTML = '<i class="fa-solid fa-moon text-sm"></i>';
            } else {
                body.classList.remove('bg-slate-100', 'text-slate-900');
                body.classList.add('bg-slate-900', 'text-slate-100');
                themeBtn.innerHTML = '<i class="fa-solid fa-sun text-sm"></i>';
            }
        }

        // Dil Değiştirme (20 Dil)
        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('cpm_lang', lang);
            updateTranslations();
            renderView();
        }

        function t(key) {
            if(TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) {
                return TRANSLATIONS[currentLang][key];
            }
            return TRANSLATIONS['tr'][key] || key;
        }

        function updateTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) {
                    el.innerText = TRANSLATIONS[currentLang][key];
                }
            });
        }

        function triggerLoginLoading(callback) {
            const loader = document.getElementById('loadingScreen');
            loader.classList.remove('hidden');
            setTimeout(() => {
                loader.classList.add('opacity-0');
                setTimeout(() => {
                    loader.classList.add('hidden');
                    loader.classList.remove('opacity-0');
                    if(callback) callback();
                }, 420);
            }, 650);
        }

        function saveData() {
            localStorage.setItem('cpm_cars', JSON.stringify(cars));
            localStorage.setItem('cpm_users', JSON.stringify(users));
            localStorage.setItem('cpm_current_user', JSON.stringify(currentUser));
        }

        function updateNavbar() {
            const area = document.getElementById('navAuthArea');
            if(currentUser) {
                let adminBadge = currentUser.isAdmin ? `<span class="bg-red-500/20 text-red-400 border border-red-500/30 text-xs px-2 py-0.5 rounded-full font-bold">Admin</span>` : '';
                area.innerHTML = `
                    <button onclick="openAddCarModal()" class="bg-brand-500 hover:bg-brand-600 text-slate-950 px-4 py-2 rounded-xl font-bold text-sm transition flex items-center gap-2 shadow-lg shadow-brand-500/20">

                    </button>
                    <div class="flex items-center gap-3 bg-slate-800/80 border border-slate-700/50 py-1.5 px-3 rounded-xl cursor-pointer" onclick="changeView('profile')">
                        <div class="w-8 h-8 rounded-full bg-brand-500 text-slate-950 font-bold flex items-center justify-center uppercase">${currentUser.username[0]}</div>
                        <div class="text-left hidden sm:block">
                            <div class="text-xs font-bold text-white flex items-center gap-1">${currentUser.username} ${adminBadge}</div>
                            <div class="text-[10px] text-slate-400">Profil</div>
                        </div>
                    </div>
                    ${currentUser.isAdmin ? `<button onclick="changeView('admin')" class="bg-slate-800 hover:bg-slate-700 text-brand-400 p-2.5 rounded-xl border border-brand-500/30" title="Admin Paneli"><i class="fa-solid fa-shield-halved"></i></button>` : ''}
                    <button onclick="handleLogout()" class="text-slate-400 hover:text-red-400 p-2"><i class="fa-solid fa-right-from-bracket text-lg"></i></button>
                `;
            } else {
                area.innerHTML = `
                    <button onclick="openAuthModal()" class="bg-brand-500 hover:bg-brand-600 text-slate-950 px-5 py-2.5 rounded-xl font-bold text-sm transition shadow-lg shadow-brand-500/20" data-i18n="loginTab">
                        Giriş Yap / Kayıt Ol
                    </button>
                `;
            }
            updateTranslations();
        }

        function changeView(viewName, param = null) {
            currentView = viewName;
            if(param !== null) selectedCarId = param;
            renderView();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function renderView() {
            const container = document.getElementById('mainContainer');
            if(currentView === 'home') container.innerHTML = getHomeHTML();
            else if(currentView === 'detail') container.innerHTML = getDetailHTML(selectedCarId);
            else if(currentView === 'profile') container.innerHTML = getProfileHTML();
            else if(currentView === 'admin') container.innerHTML = getAdminHTML();
            updateTranslations();
        }

        function formatPrice(car) {
            const value = Number(car.price || 0).toLocaleString('tr-TR');
            if(car.currency === 'tl') return `₺${value}`;
            if(car.currency === 'gold') return `🥇 ${value} Altın`;
            return `🪙 ${value} Coin`;
        }

        function currencyLabel(currency) {
            if(currency === 'tl') return 'TL';
            if(currency === 'gold') return 'Altın';
            return 'Coin';
        }

        function getHomeHTML() {
            const activeCars = cars.filter(c => c.status === 'YAYINDA');
            return `
                <div class="soft-enter bg-slate-800/60 border border-slate-700/50 rounded-2xl p-6 mb-8 backdrop-blur-md shadow-xl">
                    <h1 class="text-2xl sm:text-3xl font-black mb-2 text-white" data-i18n="homeTitle">Car Parking Pazarında Hayalindeki Arabayı Bul</h1>
                    <p class="text-slate-400 text-sm mb-6">İlanları para birimine göre filtrele, araçları karşılaştır ve topluluk tepkilerini gör.</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        <input type="text" id="filterSearch" placeholder="Araç veya ilan ara..." class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                        <select id="filterCurrency" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                            <option value="">Tüm Para Birimleri</option>
                            <option value="coin">🪙 Coinli</option>
                            <option value="tl">₺ TL İle</option>
                            <option value="gold">🥇 Altınla</option>
                        </select>
                        <button onclick="filterCars()" class="bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-brand-500/20"><i class="fa-solid fa-filter"></i> Filtrele</button>
                    </div>
                </div>
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-car-rear text-brand-500"></i> <span data-i18n="currentAds">Güncel İlanlar</span></h2>
                    <span class="text-xs text-slate-400 bg-slate-800 px-3 py-1 rounded-full"><span id="carCount">${activeCars.length}</span> <span data-i18n="adsShowing">ilan gösteriliyor</span></span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="carListGrid">
                    ${activeCars.map(car => carCardTemplate(car)).join('')}
                </div>
            `;
        }

        function carCardTemplate(car) {
            return `
                <div class="soft-enter bg-slate-800/80 border border-slate-700/60 rounded-2xl overflow-hidden hover:border-brand-500/50 hover:-translate-y-1 transition duration-300 group flex flex-col shadow-lg">
                    <div class="relative h-52 overflow-hidden bg-slate-900">
                        <img src="${car.photos?.[0] || ''}" alt="${car.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute top-3 left-3 bg-slate-950/80 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold text-brand-400 border border-brand-500/30">${car.condition || 'Tuning Bilgisi Yok'}</div>
                        <div class="absolute top-3 right-3 bg-slate-950/85 backdrop-blur-md px-3 py-1 rounded-full text-[11px] font-bold text-white border border-slate-700">${currencyLabel(car.currency)}</div>
                        <div class="absolute bottom-3 right-3 bg-slate-950/90 backdrop-blur-md px-3 py-1.5 rounded-xl font-black text-brand-400 text-lg border border-slate-700 shadow-xl">${formatPrice(car)}</div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="font-bold text-white text-base mb-3 line-clamp-2 group-hover:text-brand-400 transition">${car.title}</h3>
                        <div class="grid grid-cols-2 gap-2 py-2 border-t border-b border-slate-700/50 text-xs text-slate-300 mb-4">
                            <div><i class="fa-solid fa-bolt text-brand-500 mr-1"></i> ${car.hp || 0} HP</div>
                            <div><i class="fa-solid fa-eye text-brand-500 mr-1"></i> ${car.views || 0} görüntülenme</div>
                        </div>
                        <div class="flex items-center gap-2 mb-4">
                            <button onclick="reactToCar(${car.id}, 'like')" class="flex-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 rounded-xl py-2 text-xs font-bold transition"><i class="fa-regular fa-thumbs-up mr-1"></i> ${car.likes || 0}</button>
                            <button onclick="reactToCar(${car.id}, 'dislike')" class="flex-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 rounded-xl py-2 text-xs font-bold transition"><i class="fa-regular fa-thumbs-down mr-1"></i> ${car.dislikes || 0}</button>
                        </div>
                        <div class="mt-auto flex items-center justify-between pt-2">
                            <span class="text-[11px] text-slate-500 flex items-center gap-1"><i class="fa-regular fa-user"></i> ${car.seller}</span>
                            <button onclick="changeView('detail', ${car.id})" class="bg-slate-700 hover:bg-brand-500 hover:text-slate-950 text-white text-xs font-bold px-4 py-2 rounded-xl transition" data-i18n="inspectAd">İlanı İncele</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function filterCars() {
            const search = (document.getElementById('filterSearch')?.value || '').toLowerCase().trim();
            const currency = document.getElementById('filterCurrency')?.value || '';
            let filtered = cars.filter(c => c.status === 'YAYINDA');
            if(search) filtered = filtered.filter(c => (c.title || '').toLowerCase().includes(search) || (c.seller || '').toLowerCase().includes(search));
            if(currency) filtered = filtered.filter(c => (c.currency || 'coin') === currency);
            const grid = document.getElementById('carListGrid');
            const count = document.getElementById('carCount');
            if(!grid || !count) return;
            count.innerText = filtered.length;
            grid.innerHTML = filtered.length ? filtered.map(c => carCardTemplate(c)).join('') : `<div class="col-span-3 text-center py-12 text-slate-500">Aradığınız kriterlere uygun ilan bulunamadı.</div>`;
        }

        function getGuestId() {
            let id = localStorage.getItem('cpm_guest_id');
            if(!id) { id = 'g_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); localStorage.setItem('cpm_guest_id', id); }
            return id;
        }

        function reactToCar(id, type) {
            const car = cars.find(c => c.id === id);
            if(!car) return;
            const key = type === 'like' ? 'likedBy' : 'dislikedBy';
            const otherKey = type === 'like' ? 'dislikedBy' : 'likedBy';
            const currentKey = currentUser ? currentUser.username : getGuestId();
            car[key] = Array.isArray(car[key]) ? car[key] : [];
            car[otherKey] = Array.isArray(car[otherKey]) ? car[otherKey] : [];
            if(car[key].includes(currentKey)) return;
            const otherIndex = car[otherKey].indexOf(currentKey);
            if(otherIndex >= 0) { car[otherKey].splice(otherIndex, 1); const otherCount = type === 'like' ? 'dislikes' : 'likes'; car[otherCount] = Math.max(0, (car[otherCount] || 0) - 1); }
            car[key].push(currentKey);
            const countKey = type === 'like' ? 'likes' : 'dislikes';
            car[countKey] = (car[countKey] || 0) + 1;
            saveData();
            renderView();
        }

        function getDetailHTML(id) {
            const car = cars.find(c => c.id === id);
            if(!car) return `<div class="text-center py-20 text-slate-400">İlan bulunamadı. <button onclick="changeView('home')" class="text-brand-500 underline">Ana sayfaya dön</button></div>`;
            const viewSessionKey = `cpm_viewed_${car.id}`;
            if(!sessionStorage.getItem(viewSessionKey)) { car.views = (car.views || 0) + 1; sessionStorage.setItem(viewSessionKey, '1'); saveData(); }
            
            return `
                <button onclick="changeView('home')" class="mb-6 text-sm text-slate-400 hover:text-white flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> <span data-i18n="backToAds">İlanlara Geri Dön</span>
                </button>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-slate-800 border border-slate-700/60 rounded-2xl overflow-hidden p-2 shadow-xl">
                            <div class="h-96 rounded-xl overflow-hidden bg-slate-900 mb-2">
                                <img id="mainDetailPhoto" src="${car.photos?.[0] || ''}" class="w-full h-full object-cover">
                            </div>
                            <div class="grid grid-cols-4 gap-2">
                                ${(car.photos || []).map((p) => `
                                    <div onclick="document.getElementById('mainDetailPhoto').src='${p}'" class="h-20 rounded-lg overflow-hidden cursor-pointer border-2 border-transparent hover:border-brand-500 transition">
                                        <img src="${p}" class="w-full h-full object-cover">
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl">
                            <h3 class="text-lg font-bold text-white mb-3" data-i18n="carDescription">Araç Açıklaması & Tuning Detayları</h3>
                            <p class="text-slate-300 text-sm leading-relaxed whitespace-pre-line">${car.desc}</p>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl">
                            <span class="text-xs bg-brand-500/20 text-brand-400 px-3 py-1 rounded-full font-bold border border-brand-500/30">${car.condition}</span>
                            <h1 class="text-xl font-bold text-white mt-3 mb-2">${car.title}</h1>
                            <div class="text-3xl font-black text-brand-400 mb-6">${formatPrice(car)}</div>
                            <div class="space-y-3 border-t border-slate-700/60 pt-4 text-sm">
                                <div class="flex justify-between"><span class="text-slate-400">Para Birimi:</span> <span class="font-bold text-white">${currencyLabel(car.currency)}</span></div>
                                <div class="flex justify-between"><span class="text-slate-400">Motor Gücü:</span> <span class="font-bold text-white">${car.hp || 0} HP</span></div>
                                <div class="flex justify-between"><span class="text-slate-400">Görüntülenme:</span> <span class="font-bold text-white">${car.views || 0}</span></div>
                            </div>
                            <div class="grid grid-cols-2 gap-3 mt-5">
                                <button onclick="reactToCar(${car.id}, 'like')" class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 rounded-xl py-3 font-bold"><i class="fa-regular fa-thumbs-up mr-1"></i> Beğen <span>${car.likes || 0}</span></button>
                                <button onclick="reactToCar(${car.id}, 'dislike')" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 rounded-xl py-3 font-bold"><i class="fa-regular fa-thumbs-down mr-1"></i> Beğenme <span>${car.dislikes || 0}</span></button>
                            </div>
                        </div>

                        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl">
                            <h3 class="text-sm font-bold text-slate-400 uppercase mb-3" data-i18n="sellerInfo">Satıcı Bilgileri</h3>
                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-12 h-12 rounded-full bg-brand-500 text-slate-950 font-bold text-xl flex items-center justify-center">${car.seller[0]}</div>
                                <div>
                                    <div class="font-bold text-white">${car.seller}</div>
                                    <div class="text-xs text-slate-400" data-i18n="verifiedMember">CPMPazari Doğrulanmış Oyuncu</div>
                                </div>
                            </div>
                            <button onclick="alert('Car Parking Oyuncu ID İletişim Simülasyonu: Oyuncu ID #CPM-88291')" class="w-full bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-brand-500/20 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-gamepad"></i> <span data-i18n="callSeller">Oyuncu ile İletişime Geç (ID)</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function getProfileHTML() {
            if(!currentUser) return `<div class="text-center py-20 text-slate-400">Lütfen giriş yapın.</div>`;
            const myCars = cars.filter(c => c.seller === currentUser.username);
            const activeCars = myCars.filter(c => c.status === 'YAYINDA' || c.status === 'BEKLEMEDE' || c.status === 'REDDEDİLDİ');
            const soldCars = myCars.filter(c => c.status === 'SATILDI');

            return `
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-8 mb-8 shadow-xl flex flex-col sm:flex-row items-center gap-6">
                    <div class="w-24 h-24 rounded-full bg-brand-500 text-slate-950 font-black text-4xl flex items-center justify-center shadow-lg shadow-brand-500/20 uppercase">
                        ${currentUser.username[0]}
                    </div>
                    <div class="text-center sm:text-left">
                        <h1 class="text-2xl font-black text-white flex items-center gap-2 justify-center sm:justify-start">
                            ${currentUser.username} 
                            ${currentUser.isAdmin ? '<span class="bg-red-500/20 text-red-400 text-xs px-2.5 py-0.5 rounded-full border border-red-500/30">Admin</span>' : ''}
                        </h1>
                        <p class="text-slate-400 text-sm mt-1">E-posta: ${currentUser.email}</p>
                        <p class="text-slate-500 text-xs mt-1"><i class="fa-regular fa-calendar mr-1"></i> Katılım: ${currentUser.joinDate || '01.01.2025'}</p>
                    </div>
                    <div class="sm:ml-auto flex gap-3">
                        <button onclick="openAddCarModal()" class="bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold px-5 py-3 rounded-xl shadow-lg transition" data-i18n="addCarModalTitle">İlan Ekle</button>
                    </div>
                </div>

                <div class="space-y-8">
                    <div>
                        <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-car text-brand-500"></i> <span data-i18n="myActiveAds">Aktif / Bekleyen / Reddedilen İlanlarım</span></h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${activeCars.length > 0 ? activeCars.map(car => profileCarCard(car)).join('') : `<div class="text-slate-500 text-sm" data-i18n="noActiveAds">${t('noActiveAds')}</div>`}
                        </div>
                    </div>

                    <div>
                        <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-circle-check text-brand-500"></i> <span data-i18n="mySoldAds">Satılmış İlanlarım</span></h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${soldCars.length > 0 ? soldCars.map(car => profileCarCard(car)).join('') : `<div class="text-slate-500 text-sm" data-i18n="noSoldAds">${t('noSoldAds')}</div>`}
                        </div>
                    </div>
                </div>
            `;
        }

        function profileCarCard(car) {
            let statusBadge = '';
            if(car.status === 'YAYINDA') statusBadge = '<span class="bg-green-500/20 text-green-400 border border-green-500/30 px-3 py-1 rounded-full text-xs font-bold">Yayında</span>';
            else if(car.status === 'BEKLEMEDE') statusBadge = '<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-full text-xs font-bold">Beklemede</span>';
            else if(car.status === 'REDDEDİLDİ') statusBadge = `<span class="bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-full text-xs font-bold" title="${car.rejectionReason}">Reddedildi</span>`;
            else if(car.status === 'SATILDI') statusBadge = '<span class="bg-blue-500/20 text-blue-400 border border-blue-500/30 px-3 py-1 rounded-full text-xs font-bold">Satıldı</span>';

            return `
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl overflow-hidden p-4 shadow-lg flex flex-col justify-between">
                    <div>
                        <div class="h-40 rounded-xl overflow-hidden mb-3 bg-slate-900 relative">
                            <img src="${car.photos[0]}" class="w-full h-full object-cover">
                            <div class="absolute top-2 right-2">${statusBadge}</div>
                        </div>
                        <h3 class="font-bold text-white text-base mb-1">${car.title}</h3>
                        <div class="text-brand-400 font-bold mb-2">$${car.price.toLocaleString()}</div>
                    </div>
                    <div class="flex gap-2 pt-2 border-t border-slate-700/50">
                        <button onclick="changeView('detail', ${car.id})" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold py-2 rounded-xl transition" data-i18n="inspectAd">İncele</button>
                        ${car.status !== 'SATILDI' ? `<button onclick="markAsSold(${car.id})" class="bg-brand-500/20 hover:bg-brand-500 text-brand-400 hover:text-slate-950 text-xs font-bold px-3 py-2 rounded-xl transition" data-i18n="markAsSold">Satıldı İşaretle</button>` : ''}
                    </div>
                </div>
            `;
        }

        function markAsSold(id) {
            const car = cars.find(c => c.id === id);
            if(car) {
                car.status = 'SATILDI';
                saveData();
                renderView();
            }
        }

        function getAdminHTML() {
            if(!currentUser || !currentUser.isAdmin) {
                return `<div class="text-center py-20 text-red-400 font-bold">Bu sayfaya erişim yetkiniz yok!</div>`;
            }

            const pendingCars = cars.filter(c => c.status === 'BEKLEMEDE');

            return `
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 mb-8 shadow-xl flex items-center justify-between flex-wrap gap-4">
                    <div>
                        <h1 class="text-2xl font-black text-white flex items-center gap-2"><i class="fa-solid fa-shield-halved text-brand-500"></i> <span data-i18n="adminPanelTitle">Admin Paneli</span></h1>
                        <p class="text-slate-400 text-sm" data-i18n="adminPanelDesc">Car Parking ilanlarını denetleyin, oyuncuları yönetin.</p>
                    </div>
                    <div class="flex gap-4">
                        <div class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-center">
                            <span class="block text-xs text-slate-400" data-i18n="pendingAdsCount">Bekleyen İlan</span>
                            <span class="text-lg font-bold text-amber-400">${pendingCars.length}</span>
                        </div>
                        <div class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-center">
                            <span class="block text-xs text-slate-400" data-i18n="totalUsersCount">Toplam Oyuncu</span>
                            <span class="text-lg font-bold text-brand-400">${users.length}</span>
                        </div>
                    </div>
                </div>

                <div class="mb-8">
                    <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-clock text-amber-400"></i> <span data-i18n="pendingAdsHeader">Bekleyen İlanlar</span></h2>
                    <div class="space-y-4">
                        ${pendingCars.length > 0 ? pendingCars.map(car => adminCarRow(car)).join('') : `<div class="bg-slate-800/50 p-6 rounded-2xl text-slate-500 text-sm" data-i18n="noPendingAds">${t('noPendingAds')}</div>`}
                    </div>
                </div>

                <div class="mb-8">
                    <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-list text-brand-500"></i> <span data-i18n="manageAllAdsHeader">Tüm İlanları Yönet</span></h2>
                    <div class="space-y-4">
                        ${cars.map(car => adminCarRow(car)).join('')}
                    </div>
                </div>

                <div>
                    <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-users text-brand-500"></i> <span data-i18n="userManagementHeader">Oyuncu Yönetimi</span></h2>
                    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl overflow-hidden shadow-xl">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-700 bg-slate-900/50 text-xs uppercase text-slate-400">
                                    <th class="p-4" data-i18n="usernameCol">Kullanıcı Adı</th>
                                    <th class="p-4" data-i18n="emailCol">E-posta</th>
                                    <th class="p-4" data-i18n="roleCol">Rol</th>
                                    <th class="p-4" data-i18n="statusCol">Durum</th>
                                    <th class="p-4 text-right" data-i18n="actionsCol">İşlemler</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-700/50 text-sm">
                                ${users.map(u => `
                                    <tr>
                                        <td class="p-4 font-bold text-white">${u.username}</td>
                                        <td class="p-4 text-slate-300">${u.email}</td>
                                        <td class="p-4">${u.isAdmin ? '<span class="text-red-400 font-bold">Admin</span>' : 'Oyuncu'}</td>
                                        <td class="p-4">${u.banned ? '<span class="text-red-500 font-bold">Engelli</span>' : '<span class="text-green-400 font-bold">Aktif</span>'}</td>
                                        <td class="p-4 text-right space-x-2">
                                            ${!u.isAdmin ? (
                                                u.banned ? 
                                                `<button onclick="unbanUser('${u.username}')" class="bg-green-500/20 text-green-400 px-3 py-1 rounded-lg text-xs font-bold" data-i18n="unbanBtn">Engeli Kaldır</button>` :
                                                `<button onclick="banUser('${u.username}')" class="bg-red-500/20 text-red-400 px-3 py-1 rounded-lg text-xs font-bold" data-i18n="banBtn">Engelle</button>`
                                            ) : `<span class="text-xs text-slate-500" data-i18n="systemOwner">Sistem Sahibi</span>`}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function adminCarRow(car) {
            return `
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-lg">
                    <div class="flex items-center gap-4 w-full sm:w-auto">
                        <img src="${car.photos[0]}" class="w-20 h-20 rounded-xl object-cover bg-slate-900">
                        <div>
                            <div class="text-xs text-brand-400 font-bold uppercase">${car.status} - Oyuncu: ${car.seller}</div>
                            <h3 class="font-bold text-white text-base">${car.title}</h3>
                            <div class="text-slate-400 text-xs">$${car.price.toLocaleString()} | ${car.brand} ${car.model} (${car.hp} HP)</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 flex-wrap justify-end w-full sm:w-auto">
                        <button onclick="changeView('detail', ${car.id})" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-xl text-xs font-bold" data-i18n="inspectAd">İncele</button>
                        ${car.status === 'BEKLEMEDE' ? `
                            <button onclick="approveCar(${car.id})" class="bg-green-500 hover:bg-green-600 text-slate-950 px-3 py-2 rounded-xl text-xs font-bold" data-i18n="approveBtn">Onayla</button>
                            <button onclick="rejectCarPrompt(${car.id})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-xl text-xs font-bold" data-i18n="rejectBtn">Reddet</button>
                        ` : ''}
                        <button onclick="editCarPricePrompt(${car.id})" class="bg-blue-500/20 text-blue-400 hover:bg-blue-500 hover:text-white px-3 py-2 rounded-xl text-xs font-bold" data-i18n="changePriceBtn">Fiyat Değiştir</button>
                        <button onclick="deleteCar(${car.id})" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `;
        }

        function approveCar(id) {
            const car = cars.find(c => c.id === id);
            if(car) { car.status = 'YAYINDA'; saveData(); renderView(); }
        }

        function rejectCarPrompt(id) {
            const reason = prompt("Reddetme sebebi nedir?");
            if(reason !== null) {
                const car = cars.find(c => c.id === id);
                if(car) { car.status = 'REDDEDİLDİ'; car.rejectionReason = reason; saveData(); renderView(); }
            }
        }

        function editCarPricePrompt(id) {
            const car = cars.find(c => c.id === id);
            const newPrice = prompt("Yeni oyun içi fiyatı girin ($):", car.price);
            if(newPrice && !isNaN(newPrice)) { car.price = Number(newPrice); saveData(); renderView(); }
        }

        function deleteCar(id) {
            if(confirm("Bu ilanı silmek istediğinize emin misiniz?")) {
                cars = cars.filter(c => c.id !== id);
                saveData();
                renderView();
            }
        }

        function banUser(username) {
            const u = users.find(x => x.username === username);
            if(u) { u.banned = true; saveData(); renderView(); }
        }

        function unbanUser(username) {
            const u = users.find(x => x.username === username);
            if(u) { u.banned = false; saveData(); renderView(); }
        }

        function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }

        function switchTab(tab) {
            const loginTab = document.getElementById('loginTabBtn');
            const registerTab = document.getElementById('registerTabBtn');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if(tab === 'login') {
                loginTab.classList.add('text-brand-500', 'border-b-2', 'border-brand-500');
                loginTab.classList.remove('text-slate-400');
                registerTab.classList.remove('text-brand-500', 'border-b-2', 'border-brand-500');
                registerTab.classList.add('text-slate-400');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                registerTab.classList.add('text-brand-500', 'border-b-2', 'border-brand-500');
                registerTab.classList.remove('text-slate-400');
                loginTab.classList.remove('text-brand-500', 'border-b-2', 'border-brand-500');
                loginTab.classList.add('text-slate-400');
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            const user = users.find(u => (u.username === identifier || u.email === identifier) && u.pass === pass);
            if(user) {
                if(user.banned) { alert("Hesabınız engellenmiştir."); return; }
                currentUser = user;
                saveData();
                closeAuthModal();
                triggerLoginLoading(() => {
                    updateNavbar();
                    renderView();
                });
            } else {
                alert("Kullanıcı adı/e-posta veya şifre hatalı!");
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUser').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            const passConfirm = document.getElementById('regPassConfirm').value;

            if(pass !== passConfirm) { alert("Şifreler birbiriyle eşleşmiyor!"); return; }
            if(users.some(u => u.username === username)) { alert("Bu kullanıcı adı zaten alınmış."); return; }

            const newUser = {
                username,
                email,
                pass,
                isAdmin: false,
                banned: false,
                joinDate: new Date().toLocaleDateString('tr-TR')
            };

            users.push(newUser);
            currentUser = newUser;
            saveData();
            closeAuthModal();
            triggerLoginLoading(() => {
                updateNavbar();
                renderView();
            });
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('cpm_current_user');
            updateNavbar();
            renderView();
        }

        let pendingPhotoData = [];

        function openAddCarModal() {
            if(!currentUser) { alert("İlan vermek için lütfen giriş yapın."); openAuthModal(); return; }
            pendingPhotoData = [];
            document.getElementById('addCarModal').classList.remove('hidden');
            document.getElementById('photoPreview').innerHTML = '';
            document.getElementById('photoCountText').innerText = 'Henüz görsel seçilmedi.';
        }
        function closeAddCarModal() { document.getElementById('addCarModal').classList.add('hidden'); }

        function handlePhotoSelection(event) {
            const files = Array.from(event.target.files || []).filter(f => f.type.startsWith('image/')).slice(0, 8);
            pendingPhotoData = [];
            const preview = document.getElementById('photoPreview');
            preview.innerHTML = '';
            if(!files.length) { document.getElementById('photoCountText').innerText = 'Henüz görsel seçilmedi.'; return; }
            let completed = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const maxW = 1400;
                        const scale = Math.min(1, maxW / img.width);
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.max(1, Math.round(img.width * scale));
                        canvas.height = Math.max(1, Math.round(img.height * scale));
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        pendingPhotoData.push(canvas.toDataURL('image/jpeg', 0.82));
                        completed++;
                        if(completed === files.length) {
                            preview.innerHTML = pendingPhotoData.map((src,i) => `<img src="${src}" class="rounded-lg border border-slate-700 object-cover" title="Görsel ${i+1}">`).join('');
                            document.getElementById('photoCountText').innerText = `${pendingPhotoData.length} görsel seçildi.`;
                        }
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function handleAddNewCar(e) {
            e.preventDefault();
            if(pendingPhotoData.length < 1) { alert("Lütfen galeriden en az 1 araç görseli seçin."); return; }
            const newCar = {
                id: Date.now(),
                title: document.getElementById('carTitle').value.trim(),
                hp: Number(document.getElementById('carHp').value),
                condition: document.getElementById('carCondition').value,
                price: Number(document.getElementById('carPrice').value),
                currency: document.getElementById('carCurrency').value,
                desc: document.getElementById('carDesc').value.trim(),
                photos: [...pendingPhotoData],
                status: 'BEKLEMEDE',
                rejectionReason: '',
                seller: currentUser.username,
                likes: 0, dislikes: 0, views: 0, likedBy: [], dislikedBy: []
            };
            cars.push(newCar);
            saveData();
            closeAddCarModal();
            document.getElementById('addCarForm').reset();
            document.getElementById('photoPreview').innerHTML = '';
            document.getElementById('photoCountText').innerText = 'Henüz görsel seçilmedi.';
            pendingPhotoData = [];
            alert("İlanınız başarıyla alındı! BEKLEMEDE → ADMİN İNCELEMESİ aşamasına gönderildi.");
            changeView('profile');
        }
    </script>
</body>
</html>
